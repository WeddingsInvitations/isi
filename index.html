<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Undangan</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!-- Layer 1: Fixed Background -->
  <div class="background-fixed"></div>

  <!-- Layer 2: Content Scrollable -->
  <div class="home-content">
    <section id="home">
      <!-- Logo buatan sendiri -->
      <img src="1311020b-cb53-422d-a1be-e058328dc3d3.png" alt="Logo" class="logo-home"/>

      <!-- Foto pasangan -->
      <div class="photo-wrapper">
        <img src="home/IMG_437.jpg" alt="Foto Pasangan" class="couple-photo animate-down" />
      </div>

      <!-- Quotes -->
      <div class="quote-box">
        <p class="quote">
          "Dan di antara tanda-tanda (kebesaran)-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri,
          agar kamu cenderung dan merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang."
        </p>
        <p class="reference">— QS. Ar-Rum: 21</p>
      </div>
    </section>
  </div>

  <script src="home.js"></script>
</body>
</html>
